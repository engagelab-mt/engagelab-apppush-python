name: Publish Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a stable release tag such as v0.1.2')
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if tag != 'v' + version:
              raise SystemExit(f'Tag {tag} does not match package version {version}')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          if head != tagged:
              raise SystemExit('Checkout does not match release tag')
          subprocess.run(['git', 'merge-base', '--is-ancestor', head, 'origin/main'], check=True)
          print(f'Releasing {version} from {head}')
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/sdk-wheel-check
          /tmp/sdk-wheel-check/bin/python -m pip install --no-index dist/*.whl
          cd /tmp
          /tmp/sdk-wheel-check/bin/python -c 'from importlib.metadata import version; from engagelab import Client; print(version("engagelab-apppush"), Client)'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/engagelab-apppush/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
