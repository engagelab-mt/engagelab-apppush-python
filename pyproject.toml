[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engagelab-apppush"
version = "0.1.0"
description = "EngageLab AppPush REST API Python SDK (zero third-party dependencies)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["engagelab", "push", "notification", "apppush", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/engagelab-mt/engagelab-apppush-python"
Repository = "https://github.com/engagelab-mt/engagelab-apppush-python"
Issues = "https://github.com/engagelab-mt/engagelab-apppush-python/issues"

[tool.setuptools.packages.find]
include = ["engagelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
